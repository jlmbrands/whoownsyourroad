<title>Who Owns Your Road</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
@font-face { font-family: "Overpass"; font-weight: 400; font-style: normal; font-display: swap; src: url("/fonts/overpass-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-weight: 400; font-style: italic; font-display: swap; src: url("/fonts/overpass-latin-400-italic.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-weight: 600; font-style: normal; font-display: swap; src: url("/fonts/overpass-latin-600-normal.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-weight: 700; font-style: normal; font-display: swap; src: url("/fonts/overpass-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-weight: 800; font-style: normal; font-display: swap; src: url("/fonts/overpass-latin-800-normal.woff2") format("woff2"); }
@font-face { font-family: "Overpass"; font-weight: 900; font-style: normal; font-display: swap; src: url("/fonts/overpass-latin-900-normal.woff2") format("woff2"); }
/* Layout: full-bleed road map, a fixed dossier rail on the right (bottom sheet on phones).
   The road network IS the basemap; nothing else is drawn. */
:root{
  --bg:#0f1115; --panel:#171a21; --panel-2:#1f232c; --fg:#eef0f4; --muted:#9aa3b2; --line:#2a2f3a;
  --road-city:#2c3240; --road-county:#4a5265; --road-state:#8e97a8; --road-federal:#6f8a6a;
  --road-stoll:#e0b84a; --road-auth:#f28c28; --road-conc:#ff3d5a; --road-private:#c86bff;
  --accent:#ff3d5a; --county-line:#262b36;
  --display:'Overpass',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#f6f4ef; --fg:#15171c; --muted:#5d6572; --line:#dcd8cf;
  --road-city:#d9d5cc; --road-county:#b6b1a6; --road-state:#5c6270; --road-federal:#7fa07a;
  --road-stoll:#b8880f; --road-auth:#e0761a; --road-conc:#e0122f; --road-private:#9a3fd6; --accent:#e0122f; --county-line:#e4e0d7; color-scheme:light }}
:root[data-theme="light"]{
  --bg:#f3f1ec; --panel:#ffffff; --panel-2:#f6f4ef; --fg:#15171c; --muted:#5d6572; --line:#dcd8cf;
  --road-city:#d9d5cc; --road-county:#b6b1a6; --road-state:#5c6270; --road-federal:#7fa07a;
  --road-stoll:#b8880f; --road-auth:#e0761a; --road-conc:#e0122f; --road-private:#9a3fd6; --accent:#e0122f; --county-line:#e4e0d7; color-scheme:light }
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--display);overflow:hidden}
#map{position:absolute;inset:0}
.maplibregl-map{position:relative;width:100%;height:100%;overflow:hidden;font:inherit}
.maplibregl-canvas-container,.maplibregl-canvas{position:absolute;left:0;top:0}
.maplibregl-canvas{outline:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}
.maplibregl-control-container{display:none}
#brand{position:absolute;top:env(safe-area-inset-top,0px);left:0;padding:14px max(16px,env(safe-area-inset-left,0px));pointer-events:none;z-index:5}
#brand h1{margin:0;font-size:clamp(20px,3vw,30px);font-weight:900;letter-spacing:-.02em;line-height:1;text-transform:uppercase}
#brand p{margin:6px 0 0;font-family:var(--mono);font-size:12px;color:var(--muted)}
#legend{position:absolute;left:0;bottom:env(safe-area-inset-bottom,0px);padding:12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;z-index:5;background:linear-gradient(to top,var(--bg),transparent);pointer-events:none}
#legend button{pointer-events:auto;display:flex;align-items:center;gap:10px;background:none;border:0;color:var(--fg);font:500 13px var(--display);padding:2px 0;cursor:pointer;text-align:left}
#legend button[aria-pressed="false"]{opacity:.35}
#legend i{display:inline-block;width:26px;height:4px;border-radius:2px}
#legend .mi{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
#rail{position:absolute;top:env(safe-area-inset-top,0px);right:0;bottom:env(safe-area-inset-bottom,0px);width:min(400px,100%);background:var(--panel);border-left:1px solid var(--line);padding:18px max(16px,env(safe-area-inset-right,0px)) 18px 20px;overflow-y:auto;z-index:6;box-sizing:border-box;transform:translateX(0);transition:transform .25s}
#rail[hidden]{display:none}
#rail .close{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right,0px));background:var(--panel-2);border:1px solid var(--line);color:var(--fg);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.eyebrow b{color:var(--cls,var(--fg));font-weight:500}
#rail h2{margin:0 0 4px;font-size:24px;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
#rail .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin:0 0 16px}
.kv dt{color:var(--muted);margin:0}.kv dd{margin:0;font-variant-numeric:tabular-nums}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 16px}
.stat div{background:var(--panel-2);border-radius:6px;padding:10px}
.stat b{display:block;font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.dossier{border-top:2px solid var(--accent);padding-top:12px;margin-top:4px}
.dossier h3{margin:0 0 8px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.dossier p{font-size:14px;line-height:1.5;margin:0 0 10px;max-width:60ch}
.owners{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.owners li{display:flex;justify-content:space-between;gap:10px;font-size:13px;border-bottom:1px solid var(--line);padding:4px 0}
.owners li span:last-child{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.buyout{display:flex;flex-direction:column;gap:3px;margin:8px 0 6px;font-family:var(--mono);font-size:11px}
.bar{display:grid;grid-template-columns:5.5em 1fr 4.5em;align-items:center;gap:6px}
.bar i{display:block;height:8px;background:var(--accent);border-radius:2px;min-width:2px;opacity:.85}
.bar .bl{color:var(--muted)}.bar .bv{text-align:right;font-variant-numeric:tabular-nums}
.srcs{font-size:12px;color:var(--muted)}.srcs a{color:var(--muted)}
.share{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;border:0;border-radius:6px;padding:9px 14px;font:700 13px var(--display);cursor:pointer}
.share:focus-visible,#legend button:focus-visible,#rail .close:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#hint{position:absolute;top:env(safe-area-inset-top,0px);right:0;margin:14px max(16px,env(safe-area-inset-right,0px));font:12px var(--mono);color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:6px 10px;border-radius:6px;z-index:5}
#hint[hidden]{display:none}
#idx-btn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 52px);right:0;margin:0 max(16px,env(safe-area-inset-right,0px));font:700 12px var(--display);color:var(--bg);background:var(--accent);border:0;padding:8px 12px;border-radius:6px;cursor:pointer;z-index:5}
#idx{position:absolute;top:calc(env(safe-area-inset-top,0px) + 92px);right:0;margin:0 max(16px,env(safe-area-inset-right,0px));width:min(360px,calc(100% - 32px));max-height:calc(100% - 140px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;z-index:6;box-sizing:border-box}
#idx[hidden]{display:none}
#idx h4{margin:10px 0 4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#idx button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--fg);font:13px var(--display);padding:4px 0;cursor:pointer;border-bottom:1px solid var(--line)}
#idx button b{font-family:var(--mono);font-size:11px;color:var(--muted);margin-right:6px}
@media (max-width:700px){#idx-btn{top:calc(env(safe-area-inset-top,0px) + 100px)}#idx{top:calc(env(safe-area-inset-top,0px) + 140px)}}
#loading{position:absolute;inset:0;display:grid;place-items:center;font:500 14px var(--mono);color:var(--muted);z-index:7;background:var(--bg)}
#loading[hidden]{display:none}
@media (max-width:700px){
  #rail{top:auto;height:62%;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0}
  #legend{bottom:auto;top:calc(env(safe-area-inset-top,0px) + 64px);background:none}
  #legend .mi{display:none}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#rail{transition:none}}
</style>

<div id="map"></div>
<div id="loading">Loading roads…</div>
<div id="brand"><h1>Who owns<br>your road</h1><p>Every public road in America, colored by who controls it. Red roads send tolls to private investors.</p></div>
<div id="hint">Tap any road. State, county and toll roads nationwide.</div>
<button id="idx-btn" aria-expanded="false">All 53 private deals</button>
<nav id="idx" hidden aria-label="Private toll deals"><div id="idx-body"></div></nav>
<nav id="legend" aria-label="Road ownership"></nav>
<aside id="rail" hidden>
  <button class="close" aria-label="Close">×</button>
  <div id="rail-body"></div>
</aside>

<script src="vendor/maplibre-gl.min.js"></script>
<script src="vendor/pmtiles.js"></script>
<script src="map.js?v=20261030a"></script>
