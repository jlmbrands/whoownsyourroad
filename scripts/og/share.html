<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Overpass";font-weight:800;src:url("../../public/fonts/overpass-latin-800-normal.woff2")}
@font-face{font-family:"Overpass";font-weight:400;src:url("../../public/fonts/overpass-latin-400-normal.woff2")}
html,body{margin:0}
body{width:1200px;height:630px;background:#17191b;color:#fff;font-family:Overpass,Arial,sans-serif;position:relative;overflow:hidden}
.label{position:absolute;left:72px;top:64px;background:#0b6b3c;border:3px solid #fff;box-shadow:0 0 0 3px #0b6b3c;border-radius:6px;padding:8px 18px 4px;font-weight:800;font-size:26px}
.readout{position:absolute;left:72px;top:134px;width:860px;background:#0c0d0e;border:4px solid #3a3e42;border-radius:8px;padding:18px 24px;box-shadow:inset 0 0 0 3px #000}
.readout svg{width:100%;height:auto;filter:drop-shadow(0 0 7px rgba(255,176,0,.5))}
h1{position:absolute;left:72px;top:430px;margin:0;font-weight:800;font-size:48px;line-height:1.1;letter-spacing:-.015em;max-width:1060px}
p{position:absolute;left:72px;top:510px;margin:0;font-size:28px;color:#d6dad7;max-width:1000px}
.lane{position:absolute;left:0;right:0;bottom:0;height:16px;background:repeating-linear-gradient(90deg,#fff 0 72px,transparent 72px 124px) left center/100% 6px no-repeat}
.wm{position:absolute;right:72px;top:70px;font-weight:800;font-size:28px}
</style></head><body>
<div class="label">Express lanes, rush hour</div>
<div class="wm">WhoOwnsYourRoad</div>
<div class="readout" id="r"></div>
<h1>For one trip on a highway you already paid for.</h1>
<p>Private investors set the price and keep the tolls until 2061.</p>
<div class="lane"></div>
<script src="../../public/js/dotmatrix.js"></script><script>document.getElementById("r").innerHTML=dotMatrix("$24.00")</script></body></html>
